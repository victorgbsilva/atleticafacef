<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#052d59">
  <link rel="icon" type="image/png" href="assets/escudo.png">
  <title>Entrar | AAA XX-Março</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="auth-screen">
    <div class="auth-photo-layer auth-photo-a is-active" aria-hidden="true"></div>
    <div class="auth-photo-layer auth-photo-b" aria-hidden="true"></div>
    <a class="auth-back" href="index.html">← Voltar ao início</a>
    <section class="auth-panel" aria-label="Acesso à Área do Atleta">
      <img class="auth-logo" src="assets/escudo.png" alt="Escudo da AAA XX-Março">
      <p class="auth-eyebrow">ÁREA DO ATLETA</p>
      <h1>Bem-vindo<br><em>viking.</em></h1>
      <div class="auth-tabs" role="tablist" aria-label="Acesso à Área do Atleta">
        <button class="auth-tab is-active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-form" data-auth-tab="login">Login</button>
        <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-form" data-auth-tab="register" tabindex="-1">Cadastro</button>
      </div>

      <form class="auth-form" id="login-form" role="tabpanel" aria-labelledby="login-tab" data-auth-panel="login">
        <label for="login-user">Usuário ou e-mail</label>
        <input id="login-user" name="username" type="text" autocomplete="username" placeholder="Digite seu usuário" required>
        <label for="login-password">Senha</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
        <button class="auth-submit" type="submit">Entrar <span>↗</span></button>
        <p class="auth-message" id="login-message" role="status" aria-live="polite"></p>
        <p class="auth-prompt">Não tem uma conta? <button type="button" data-open-register>Cadastre-se</button></p>
      </form>

      <div class="auth-register-panel" id="register-panel" role="tabpanel" aria-labelledby="register-tab" data-auth-panel="register" hidden>
      <form class="auth-form auth-register" id="register-form">
        <h2>Crie sua conta</h2>
        <label for="register-name">Nome completo</label>
        <input id="register-name" name="name" type="text" autocomplete="name" placeholder="Seu nome" required>
        <label for="register-email">E-mail</label>
        <input id="register-email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required>
        <label for="register-password">Senha</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Crie uma senha" required>
        <button class="auth-submit" type="submit">Criar cadastro <span>↗</span></button>
        <p class="auth-message" id="register-message" role="status" aria-live="polite"></p>
      </form>
      <section class="auth-verification" id="verification-panel" aria-labelledby="verification-title" hidden>
        <div class="verification-icon" aria-hidden="true">✉</div>
        <h2 id="verification-title">Verifique seu e-mail</h2>
        <p>Digite o código de verificação para <strong id="verification-email"></strong>.</p>
        <form class="auth-form" id="verification-form">
          <label for="verification-code">Código de verificação</label>
          <input id="verification-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
          <button class="auth-submit" type="submit">Confirmar código <span>↗</span></button>
          <p class="auth-message" id="verification-message" role="status" aria-live="polite"></p>
        </form>
        <button class="verification-resend" id="resend-code" type="button">Reenviar código</button>
        <p class="verification-note">O envio real será ativado ao conectar o serviço de autenticação.</p>
      </section>
      </div>
      <div class="auth-success" id="registration-success" role="status" aria-live="polite" hidden>
        <img src="assets/machado-nav.png" alt="" aria-hidden="true">
        <span>Cadastrado com sucesso!</span>
        <img src="assets/machado-nav.png" alt="" aria-hidden="true">
      </div>
    </section>
    <p class="auth-footer">AAA XX DE MARÇO</p>
  </main>
  <script src="login.js"></script>
</body>
</html>
